name: Keep dashboards awake

# Streamlit Community Cloud sleeps an app after 12h with no real browser
# traffic. This drives a headless browser against each live dashboard every
# 3 hours (24/7) so they never sleep. Runs are free on public repos.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, every day (UTC)
  workflow_dispatch:         # allow manual "Run workflow" from the Actions tab

# If a scheduled run is still going when the next fires, skip the new one.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Warm dashboards
        run: python .github/scripts/keep_awake.py
