name: Keep dashboards awake

# Streamlit Community Cloud spins a container down after just a few minutes of
# no active session (the "waking up" coffee-cup splash), and fully hibernates
# after 12h idle. To keep the containers hot we drive a real headless browser
# against each dashboard every 5 minutes (24/7). Free on public repos.
# NOTE: GitHub may delay/skip scheduled runs under load, so occasional splashes
# can still slip through on the free tier — always-on hosting is the only way
# to guarantee zero cold starts.
on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes, every day (UTC)
  workflow_dispatch:         # allow manual "Run workflow" from the Actions tab

# If a scheduled run is still going when the next fires, skip the new one.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Warm dashboards
        run: python .github/scripts/keep_awake.py
